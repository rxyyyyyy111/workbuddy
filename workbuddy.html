<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WorkBuddy · 个人工作台</title>
<meta name="theme-color" content="#ec4899">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WorkBuddy">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./图标.png" type="image/png">
<link rel="apple-touch-icon" href="./图标.png">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        bloom: { 50:'#fef1f5',100:'#fde5ed',200:'#fccfdf',300:'#f9a8c7',400:'#f472a6',500:'#ec4899',600:'#db2777',700:'#be185d',800:'#9d174d',900:'#831843' }
      }
    }
  }
}
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap');
  :root {
    --bg: #fef1f5; --card: #ffffff; --text: #1e1b1e; --sub: #6b5e6b;
    --accent: #ec4899; --accent-light: #fde5ed; --border: #f0d0e0;
    --hover: #fdf2f7; --shadow: 0 4px 24px rgba(236,72,153,0.08);
    --radius: 1.25rem; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    --green: #10b981; --red: #ef4444;
  }
  .dark {
    --bg: #0f0f0f; --card: #1a1a1a; --text: #e8e4e8; --sub: #9d95a0;
    --accent: #f472a6; --accent-light: #2a1522; --border: #2a2028;
    --hover: #1f151c; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --green: #34d399; --red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; transition: background var(--transition), color var(--transition);
    overflow-x: hidden;
  }
  .card {
    background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); border: 1px solid var(--border);
    transition: all var(--transition);
  }
  .card:hover { box-shadow: 0 6px 32px rgba(236,72,153,0.12); }
  .dark .card:hover { box-shadow: 0 6px 32px rgba(0,0,0,0.5); }
  .btn {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .55rem 1.1rem; border-radius: 3rem; font-size: .875rem;
    font-weight: 500; cursor: pointer; border: none;
    transition: all var(--transition); white-space: nowrap;
    font-family: inherit; user-select: none;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .btn-ghost:hover { background: var(--hover); }
  .btn-danger { background: #fee2e2; color: #dc2626; }
  .dark .btn-danger { background: #3b1515; color: #f87171; }
  .btn-danger:hover { filter: brightness(.95); }
  .btn-sm { padding: .35rem .75rem; font-size: .78rem; border-radius: 2rem; }
  .btn-xs { padding: .2rem .55rem; font-size: .7rem; border-radius: 1.5rem; }
  .input, select.input, textarea.input {
    padding: .6rem .9rem; border-radius: .75rem; border: 1.5px solid var(--border);
    background: var(--card); color: var(--text); font-size: .875rem;
    font-family: inherit; outline: none; transition: all var(--transition);
    width: 100%; resize: vertical;
  }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(236,72,153,0.1); }
  .fade-in { animation: fadeIn .35s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes scaleIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: scale(1); } }
  .slide-up { animation: slideUp .4s ease-out; }
  .scale-in { animation: scaleIn .25s ease-out; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px); animation: fadeIn .2s ease-out;
  }
  .nav-item {
    display: flex; align-items: center; gap: .65rem; padding: .7rem 1rem;
    border-radius: .85rem; cursor: pointer; transition: all var(--transition);
    color: var(--sub); font-size: .9rem; font-weight: 500;
  }
  .nav-item:hover { background: var(--hover); color: var(--text); }
  .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  .toast {
    position: fixed; top: 1.5rem; right: 1.5rem; z-index: 200;
    padding: .75rem 1.25rem; border-radius: .85rem; font-size: .85rem;
    font-weight: 500; animation: slideIn .3s ease-out;
    box-shadow: 0 8px 32px rgba(0,0,0,.15);
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* Toggle switch */
  .toggle-opt {
    flex: 1; text-align: center; padding: .5rem; border-radius: 2rem;
    font-size: .85rem; cursor: pointer; transition: all var(--transition);
    border: 1.5px solid var(--border); color: var(--sub);
  }
  .toggle-opt.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type="checkbox"] { accent-color: var(--accent); width: 1rem; height: 1rem; cursor: pointer; }

  /* File upload pill */
  .file-pill {
    display: inline-flex; align-items: center; gap: .3rem;
    padding: .3rem .7rem; border-radius: 2rem; font-size: .75rem;
    font-weight: 500;
  }
  .file-pill-img { background: #dbeafe; color: #1e40af; }
  .file-pill-vid { background: #fce7f3; color: #9d174d; }
  .dark .file-pill-img { background: #1e3a5f; color: #93c5fd; }
  .dark .file-pill-vid { background: #3b1a2e; color: #f9a8d4; }

  /* Category badge */
  .cat-badge {
    display: inline-block; padding: .15rem .6rem; border-radius: 2rem;
    font-size: .7rem; font-weight: 600;
    background: var(--accent-light); color: var(--accent);
  }

  /* Countdown ring */
  .cd-ring-bg { stroke: var(--border); }
  .cd-ring-fg { stroke: var(--accent); transition: stroke-dashoffset .8s ease-out; }

  /* Media preview */
  .media-thumb { border-radius: .75rem; object-fit: cover; cursor: pointer; }
  video.media-thumb { max-height: 200px; background: #000; }

  /* Condition item */
  .cond-item { cursor: pointer; transition: all var(--transition); border-radius: .5rem; padding: .35rem .5rem; }
  .cond-item:hover { background: var(--hover); }
  .cond-done { text-decoration: line-through; opacity: .45; }

  /* Warehouse */
  .wh-item {
    border-radius: .85rem; padding: .6rem; cursor: pointer;
    transition: all var(--transition); text-align: center;
    border: 1.5px solid var(--border); background: var(--card);
  }
  .wh-item:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(236,72,153,0.1); }
  .wh-thumb {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: .6rem;
    background: var(--hover); display: flex; align-items: center; justify-content: center;
    font-size: 2rem;
  }
  .subcat-pill {
    display: inline-block; padding: .3rem .75rem; border-radius: 2rem;
    font-size: .78rem; cursor: pointer; transition: all var(--transition);
    border: 1.5px solid var(--border); color: var(--sub); white-space: nowrap;
  }
  .subcat-pill:hover, .subcat-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .expiry-warn { background: #fef3c7; color: #92400e; }
  .expiry-danger { background: #fee2e2; color: #991b1b; }
  .dark .expiry-warn { background: #3b2f0e; color: #fcd34d; }
  .dark .expiry-danger { background: #3b1515; color: #f87171; }

  @media (max-width: 640px) {
    .card { border-radius: 1rem; }
  }

  /* ====== AI Lion ====== */
  .lion-wrap {
    position: fixed; bottom: 20px; right: 20px; z-index: 150;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .lion-bubble {
    max-width: 220px; padding: .6rem .85rem; border-radius: 1rem 1rem .25rem 1rem;
    font-size: .78rem; line-height: 1.45; animation: popIn .35s ease-out;
    box-shadow: 0 4px 16px rgba(0,0,0,.1); word-break: break-word;
    background: var(--card); color: var(--text); border: 1.5px solid var(--border);
  }
  @keyframes popIn { from{opacity:0;transform:translateY(8px) scale(.9)} to{opacity:1;transform:translateY(0) scale(1)} }
  .lion-avatar {
    width: 72px; height: 72px; cursor: pointer; transition: transform .3s;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,.12));
    user-select: none; -webkit-user-select: none;
  }
  .lion-avatar:hover { transform: scale(1.1); }
  .lion-avatar:active { transform: scale(.95); }
  .lion-menu {
    position: absolute; bottom: 80px; right: 0; background: var(--card);
    border: 1.5px solid var(--border); border-radius: 1rem; padding: .5rem;
    box-shadow: 0 8px 32px rgba(0,0,0,.15); display: none; flex-direction: column;
    gap: 2px; min-width: 150px; animation: popIn .25s ease-out;
    z-index: 200; touch-action: manipulation; pointer-events: auto;
  }
  .lion-menu.show { display: flex; }
  .lion-menu button {
    border: none; background: transparent; color: var(--text); padding: .6rem .85rem;
    border-radius: .6rem; cursor: pointer; font-size: .85rem; text-align: left;
    transition: background .2s; font-family: inherit;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    min-height: 44px; pointer-events: auto;
  }
  .lion-menu button:hover { background: var(--hover); }
  .lion-menu button.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
  /* idle bob */
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .lion-bobbing { animation: bob 2s ease-in-out infinite; }
  /* AI toggle in header */
  .ai-toggle {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .3rem .7rem; border-radius: 2rem; font-size: .78rem;
    cursor: pointer; transition: all var(--transition); font-weight: 500;
    border: 1.5px solid var(--border);
  }
  .ai-on { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  .ai-off { background: transparent; color: var(--sub); }
  .dark .ai-on { background: #1e3a5f; color: #93c5fd; border-color: #3b6daa; }

  /* Sidebar transition & mobile centering */
  #sidebar { transition: width .25s ease; }
  @media (max-width: 1023px) {
    .nav-item { justify-content: center; padding: .65rem .3rem !important; }
    .nav-item span { font-size: 1.1rem; }
  }
  @media (min-width: 1024px) {
    #sidebar { width: 3.5rem !important; }
    main { margin-left: 3.5rem !important; }
  }

  /* Chat overlay */
  .chat-overlay {
    position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,.7);
    display: flex; flex-direction: column;
    align-items: center; animation: fadeIn .3s ease-out;
    -webkit-overflow-scrolling: touch;
  }
  .chat-lion-big {
    width: 100px; height: 100px; border-radius: 50%; object-fit: cover;
    margin-top: 2rem; flex-shrink: 0;
    box-shadow: 0 8px 32px rgba(236,72,153,0.3);
    animation: bob 2s ease-in-out infinite;
  }
  .chat-box {
    width: 92vw; max-width: 420px; flex: 1; margin: 1rem 0 1.5rem;
    background: var(--card); border-radius: 1.25rem; display: flex;
    flex-direction: column; overflow: hidden;
    box-shadow: 0 12px 48px rgba(0,0,0,.2);
  }
  .chat-msgs {
    flex: 1; overflow-y: auto; padding: 1rem; display: flex;
    flex-direction: column; gap: .6rem;
  }
  .chat-msg {
    max-width: 85%; padding: .55rem .85rem; border-radius: 1rem;
    font-size: .82rem; line-height: 1.5; animation: popIn .25s ease-out;
  }
  .chat-msg.user {
    align-self: flex-end; background: var(--accent); color: #fff;
    border-bottom-right-radius: .25rem;
  }
  .chat-msg.assistant {
    align-self: flex-start; background: var(--hover); color: var(--text);
    border-bottom-left-radius: .25rem;
  }
  .chat-input-row {
    display: flex; gap: .4rem; padding: .6rem .8rem;
    border-top: 1px solid var(--border);
  }
  .chat-input-row input {
    flex: 1; border: 1.5px solid var(--border); border-radius: 2rem;
    padding: .6rem 1rem; font-size: 1rem; background: var(--bg);
    color: var(--text); outline: none; font-family: inherit;
    -webkit-appearance: none; min-height: 44px;
  }
  .chat-input-row input:focus { border-color: var(--accent); }
  .chat-input-row button { min-height: 44px; font-size: .9rem; }
  .chat-close {
    position: absolute; top: 1rem; right: 1rem; z-index: 10;
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.9); font-size: 1.5rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #333; transition: all .2s; -webkit-tap-highlight-color: transparent;
  }
  .chat-close:hover { background: #fff; transform: scale(1.1); }
  .dark .chat-close { background: rgba(40,40,40,.9); color: #ddd; }

  /* Draggable lion */
  #lion-wrap.dragging { transition: none; }
  #lion-wrap.dragging .lion-avatar { transform: scale(1.15); }
</style>
</head>
<body class="min-h-screen">

<!-- ==================== SIDEBAR (Desktop) ==================== -->
<aside id="sidebar" class="flex flex-col fixed left-0 top-0 h-full z-50 transition-all p-2 lg:p-4" style="background:var(--card);border-right:1px solid var(--border);width:3.5rem;overflow-x:hidden;">
  <div class="flex items-center gap-2 px-1 lg:px-2 mb-4 lg:mb-6 mt-1 flex-shrink-0">
    <div class="w-7 h-7 lg:w-8 lg:h-8 rounded-lg lg:rounded-xl flex items-center justify-center text-white font-bold text-xs lg:text-sm flex-shrink-0" style="background:var(--accent);">W</div>
    <span class="font-bold text-base lg:text-lg whitespace-nowrap opacity-0 transition-opacity" style="color:var(--text)" id="sidebar-brand">WorkBuddy</span>
  </div>
  <nav class="flex flex-col gap-0.5 lg:gap-1 flex-1 overflow-y-auto" id="nav-desktop"></nav>
  <button onclick="showDataIO()" class="flex items-center justify-center p-2 rounded-xl transition-all flex-shrink-0 text-sm mb-1" style="background:transparent;color:var(--text);border:1.5px solid var(--border);cursor:pointer;font-family:inherit" title="数据导入导出">📦</button>
  <button onclick="toggleTheme()" class="flex items-center justify-center lg:justify-start gap-2 p-2 rounded-xl transition-all flex-shrink-0 text-sm" style="background:transparent;color:var(--text);border:1.5px solid var(--border);cursor:pointer;font-family:inherit" id="theme-btn-desktop"></button>
</aside>

<!-- ==================== MAIN CONTENT ==================== -->
<main id="main" class="min-h-screen p-3 lg:p-6" style="margin-left:3.5rem">
  <header class="flex items-center justify-between mb-5 lg:mb-6 pt-4 lg:pt-0">
    <div>
      <h1 id="page-title" class="text-xl lg:text-2xl font-bold"></h1>
      <p id="page-sub" class="text-sm mt-0.5" style="color:var(--sub)"></p>
    </div>
    <div class="flex items-center gap-2">
      <span id="today-clock" class="text-sm hidden sm:inline" style="color:var(--sub)"></span>
      <button onclick="toggleAI()" class="ai-toggle ai-off" id="ai-toggle-btn" title="AI 助手">🤖 AI</button>
    </div>
  </header>

  <div id="panel-calendar" class="panel"></div>
  <div id="panel-tasks" class="panel hidden"></div>
  <div id="panel-finance" class="panel hidden"></div>
  <div id="panel-archive" class="panel hidden"></div>
  <div id="panel-diary" class="panel hidden"></div>
  <div id="panel-wishes" class="panel hidden"></div>
  <div id="panel-warehouse" class="panel hidden"></div>
  <div id="panel-pwd" class="panel hidden"></div>
  <div id="panel-spirits" class="panel hidden"></div>
</main>

<div id="modal-container"></div>
<div id="toast-container"></div>

<!-- ==================== AI LION ==================== -->
<div class="lion-wrap" id="lion-wrap" style="display:none">
  <div class="lion-bubble" id="lion-bubble" style="display:none"></div>
  <div class="lion-menu" id="lion-menu">
    <button data-lvl="high" onclick="setLionLevel('high')">🗣 话多模式</button>
    <button data-lvl="mid" onclick="setLionLevel('mid')">💬 话中模式</button>
    <button data-lvl="low" onclick="setLionLevel('low')">🤫 话少模式</button>
    <hr style="border-color:var(--border);margin:2px 0">
    <button onclick="openChat()">💬 发起对话</button>
    <button onclick="closeLionMenu();showAISettings()">⚙️ 修改API</button>
  </div>
  <img id="lion-img" class="lion-avatar lion-bobbing" src="./shi.jpg" alt="狮狮" style="width:72px;height:72px;border-radius:50%;object-fit:cover;">
</div>

<script>
// ==================== GLOBAL STATE ====================
function safeParse(raw, fallbackStr) {
  try { return JSON.parse(raw || fallbackStr); } catch(e) { return JSON.parse(fallbackStr); }
}

const S = {
  theme: localStorage.getItem('wb-theme') || 'light',
  panel: localStorage.getItem('wb-panel') || 'calendar',

  // Calendar
  todos: safeParse(localStorage.getItem("wb-todos"), '[]'),
  selDate: null, calYear: null, calMonth: null,

  // Tasks
  tasks: safeParse(localStorage.getItem("wb-tasks"), '[]'),
  taskCategories: safeParse(localStorage.getItem("wb-taskCategories"), '["默认","工作","学习","生活","健身"]'),
  taskId: null, // which task detail is open

  // Countdown
  anniversaries: safeParse(localStorage.getItem("wb-anniversaries"), '[]'),

  // Finance
  transactions: safeParse(localStorage.getItem("wb-transactions"), '[]'),
  finYear: null, finMonth: null,

  // Archive
  archives: safeParse(localStorage.getItem("wb-archives"), '[]'),
  archiveId: null,

  // Diary
  diaries: safeParse(localStorage.getItem("wb-diaries"), '[]'),

  // Wishes
  wishes: safeParse(localStorage.getItem("wb-wishes"), '[]'),

  // Warehouse
  warehouseItems: safeParse(localStorage.getItem("wb-warehouseItems"), '[]'),
  warehouseSubCats: safeParse(localStorage.getItem("wb-warehouseSubCats"), '{"衣柜":[],"化妆品":[],"护肤品":[],"食品":[],"工具":[]}'),
  whCat: null,    // which main category is open (null = list)
  whSub: '全部',  // active sub-category filter

  // Password Vault
  passwords: safeParse(localStorage.getItem("wb-passwords"), '[]'),

  // Expiry warnings dismissed by user
  expiryDismissed: safeParse(localStorage.getItem("wb-expiryDismissed"), '[]'),

  // Spirit companions
  spirits: safeParse(localStorage.getItem("wb-spirits"), '[]'),
  spiritMemories: safeParse(localStorage.getItem("wb-spiritMemories"), '{}'),
};

// Spirit character pool (5 image-based characters)
const SPIRIT_POOL = [
  { personality:'毒舌懒散', img:'加菲猫.png', color:'#f97316', tone:'懒洋洋的橘猫，说话毒舌但心底柔软。最爱吐槽用户，但关键时刻一定在。"哼，随便你啦～"' },
  { personality:'暖心可爱', img:'小可.png', color:'#f472a6', tone:'温柔甜美的小可爱，永远第一个给抱抱。说话软软的，像棉花糖一样甜。"没关系的，小可陪着你好不好～"' },
  { personality:'活泼搞怪', img:'蛋小黄.png', color:'#fbbf24', tone:'一颗圆滚滚的蛋黄，元气满满！爱用感叹号，说话跳脱，永远在蹦跶。"哇！！！好棒好棒！！"' },
  { personality:'高冷神秘', img:'血河小狗.png', color:'#94a3b8', tone:'来自血河的暗黑小狗，高冷寡言但意外靠谱。说话简短冷淡但直击要害。"……嗯。知道了。"' },
  { personality:'腹黑邪恶', img:'邪恶大耳狗.png', color:'#a78bfa', tone:'表面笑嘻嘻的大耳朵狗，心里门儿清。偶尔冒出让人后背发凉的发言，但其实很护短。"（微笑）你确定要这样吗？"' },
  { personality:'温暖治愈', img:'shi.jpg', color:'#ec4899', tone:'住在手机里的小狮子，像真人朋友一样陪着用户。自称"狮狮"，温暖自然不做作。口语化，偶尔加语气词。像发微信一样简短回复，不灌鸡汤但真心陪伴。' },
];

// Companion mode state
S.companionMode = localStorage.getItem('wb-companionMode')!=='0'; // default on

const CAT_INCOME = ['工资','奖金','投资','兼职','红包','其他'];
const CAT_EXPENSE = ['餐饮','购物','交通','住房','娱乐','医疗','教育','其他'];
const ANN_TYPES = { love:'💕 恋爱', birthday:'🎂 生日', memory:'💫 纪念', other:'📌 其他' };
const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

function save(k) { localStorage.setItem('wb-'+k, JSON.stringify(S[k])); }
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmt(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function esc(s) { const el=document.createElement('div'); el.textContent=s; return el.innerHTML; }

// Helper: read multiple files as base64 data URLs
function readFiles(fileList) {
  if (!fileList||!fileList.length) return Promise.resolve([]);
  return Promise.all(Array.from(fileList).map(file => new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => resolve('');
    r.readAsDataURL(file);
  }))).then(arr => arr.filter(Boolean));
}

// Helper: get images array from a record (backward compat: image string → images array)
function getImages(record) {
  if (record.images && record.images.length) return record.images;
  if (record.image) return [record.image];
  return [];
}

// Helper: render image thumbnails HTML
function renderImageHTML(images, maxH) {
  maxH = maxH || 200;
  if (!images||!images.length) return '';
  if (images.length===1) {
    return `<img src="${images[0]}" class="media-thumb mt-2" style="max-width:100%;max-height:${maxH}px" onclick="window.open('${images[0]}')" alt="图片">`;
  }
  return `<div class="flex gap-2 flex-wrap mt-2">${images.map((img,i)=>`<img src="${img}" class="media-thumb" style="max-width:120px;max-height:120px;object-fit:cover;cursor:pointer" onclick="window.open('${img}')" alt="图片${i+1}">`).join('')}</div>`;
}

function go(id, animate=true) {
  S.panel = id; localStorage.setItem('wb-panel', id);
  document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
  const panel = document.getElementById('panel-'+id);
  panel.classList.remove('hidden');

  const n = NAV.find(x=>x.id===id);
  document.getElementById('page-title').textContent = n.icon+' '+n.label;
  document.getElementById('page-sub').textContent = SUBS[id];
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.nav===id));

// ==================== TOAST & MODAL ====================
function toast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const maps = { success:['#ecfdf5','#065f46'], error:['#fef2f2','#991b1b'], info:['#eff6ff','#1e40af'] };
  const [bg,col] = maps[type]||maps.info;
  const el = document.createElement('div');
  el.className='toast'; el.style.cssText=`background:${bg};color:${col};`;
  el.textContent=msg; c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},2000);
}

// ==================== 1. CALENDAR + TODO + ANNIVERSARIES ====================
function renderCal() {
  const now = new Date();
  if (S.calYear===null) { S.calYear=now.getFullYear(); S.calMonth=now.getMonth(); }
  const panel = document.getElementById('panel-calendar');
  const firstDay = new Date(S.calYear, S.calMonth, 1).getDay();
  const daysIn = new Date(S.calYear, S.calMonth+1, 0).getDate();
  const today = new Date(); const todayStr = fmt(today);

  // Normalize anniversaries
  S.anniversaries.forEach(a => { if (!a.mode) a.mode = 'countdown'; });

  // ---- Anniversary pills (horizontal) ----
  var annPills = '';
  var todayAnns = [];
  var sortedAnns = [...S.anniversaries].sort(function(a,b){
    var ma = a.mode||'countdown'; var mb = b.mode||'countdown';
    var isTodayA = (a.date.slice(5) === todayStr.slice(5));
    var isTodayB = (b.date.slice(5) === todayStr.slice(5));
    if (isTodayA && !isTodayB) return -1;
    if (!isTodayA && isTodayB) return 1;
    return a.date.localeCompare(b.date);
  });

  sortedAnns.forEach(function(a){
    var mode = a.mode||'countdown';
    var diff, label;
    if (mode === 'countdown') {
      var nd = nextAnnDate(a.date);
      diff = Math.ceil((nd.getTime()-today.getTime())/86400000);
      label = diff===0 ? '🎉今天' : diff+'天';
    } else {
      var origin = new Date(a.date+'T00:00:00');
      diff = Math.floor((today.getTime()-origin.getTime())/86400000);
      if (diff<0) diff=0;
      label = diff===0 ? '🎉今天' : (diff>365?Math.floor(diff/365)+'年':diff+'天');
    }
    var typeIcon = ANN_TYPES[a.type] ? ANN_TYPES[a.type].split(' ')[0] : '📌';
    annPills += '<span class="cursor-pointer flex-shrink-0" onclick="editAnn(\''+a.id+'\')" title="'+esc(a.name)+' · '+a.date+'" style="display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:2rem;font-size:.72rem;font-weight:500;background:'+(diff===0?'var(--accent-light)':'var(--hover)')+';color:'+(diff===0?'var(--accent)':'var(--sub)')+';border:1px solid '+(diff===0?'var(--accent)':'var(--border)')+';white-space:nowrap">'+typeIcon+' '+esc(a.name)+' <b>'+label+'</b></span>';
  });

  var annSection = '';
  if (annPills) {
    annSection = '<div class="flex gap-1.5 items-center mb-2 overflow-x-auto pb-1" style="scrollbar-width:none" id="ann-pills">'+annPills+'</div>';
  }

  // ---- Calendar grid ----
  let cells = '';
  const lead = firstDay===0?6:firstDay-1;
  for (let i=0;i<lead;i++) cells+='<div class="h-8 sm:h-10"></div>';

  for (let d=1;d<=daysIn;d++) {
    const ds = `${S.calYear}-${String(S.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds===todayStr;
    const isSel = ds===S.selDate;
    const tds = S.todos.filter(t=>t.date===ds);
    const done = tds.filter(t=>t.done).length;
    const pending = tds.length-done;
    cells += `<div class="h-8 sm:h-10 rounded-lg p-0.5 cursor-pointer transition-all flex flex-col items-center relative
      ${isToday?'ring-2 ring-[var(--accent)]':isSel?'ring-2':''} hover:bg-[var(--hover)]"
      style="background:${isToday?'var(--accent-light)':isSel?'var(--hover)':'transparent'};${isSel?'outline:2px solid var(--accent);outline-offset:-2px;':''}"
      onclick="pickDate('${ds}')">
      <span class="text-xs font-medium" style="color:${isToday||isSel?'var(--accent)':'var(--sub)'};font-weight:${isToday||isSel?'700':'400'}">${d}</span>
      ${tds.length>0?`<div class="flex gap-0.5 flex-wrap justify-center">${done>0?'<span class="w-1 h-1 rounded-full" style="background:var(--green)"></span>':''}${pending>0?'<span class="w-1 h-1 rounded-full" style="background:var(--accent)"></span>':''}</div>`:''}
    </div>`;
  }

  panel.innerHTML = `<div class="flex flex-col lg:flex-row gap-4">
    <div class="card p-3 lg:p-4 flex-1 slide-up">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5">
          <button class="btn btn-ghost btn-xs" onclick="S.calMonth--;if(S.calMonth<0){S.calMonth=11;S.calYear--};renderCal()">◀</button>
          <span class="font-bold text-sm">${MONTHS[S.calMonth]} ${S.calYear}</span>
          <button class="btn btn-ghost btn-xs" onclick="S.calMonth++;if(S.calMonth>11){S.calMonth=0;S.calYear++};renderCal()">▶</button>
        </div>
        <button class="btn btn-primary btn-xs" onclick="addAnn()" title="添加纪念日" style="padding:.2rem .5rem;font-size:.7rem">+ 纪念日</button>
      </div>
      ${annSection}
      ${buildExpiryWarning()}
      <div class="grid grid-cols-7 gap-0.5 text-center text-xs font-medium mb-0.5" style="color:var(--sub);font-size:.65rem">
        <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
      </div>
      <div class="grid grid-cols-7 gap-0.5">${cells}</div>
    </div>
    <div class="card p-4 flex-1 min-w-0 slide-up" id="todo-panel">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-bold" id="todo-label">选择一个日期</h3>
        <button class="btn btn-primary btn-xs" onclick="addTodo()">+ 添加待办</button>
      </div>
      <div id="todo-list" class="space-y-2 max-h-80 overflow-y-auto"></div>
    </div>
  </div>`;
  if (S.selDate) pickDate(S.selDate);
}

// Helper: next occurrence of an anniversary date
function nextAnnDate(ds) {
  var today = new Date(); today.setHours(0,0,0,0);
  var parts = ds.split('-').map(Number);
  var thisYear = new Date(today.getFullYear(), parts[1]-1, parts[2]);
  if (thisYear >= today) return thisYear;
  return new Date(today.getFullYear()+1, parts[1]-1, parts[2]);
}

// Build expiry warning banner for warehouse items
function buildExpiryWarning() {
  var today = fmt(new Date());
  var dismissed = S.expiryDismissed || [];

  // Clean up dismissed IDs that no longer exist
  var existingIds = S.warehouseItems.map(function(i){return i.id;});
  S.expiryDismissed = dismissed.filter(function(did){return existingIds.indexOf(did)!==-1;});

  var warnings = [];
  S.warehouseItems.forEach(function(item){
    if (!item.expiryDate) return;
    if (S.expiryDismissed.indexOf(item.id)!==-1) return;
    var days = Math.ceil((new Date(item.expiryDate+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
    if (days <= 14) {
      warnings.push({item:item, days:days});
    }
  });
  if (!warnings.length) return '';

  warnings.sort(function(a,b){return a.days-b.days;});

  var isExpired = warnings[0].days <= 0;
  var html = '<div class="mb-2 p-2 rounded-xl slide-up" style="border-left:3px solid '+(isExpired?'var(--red)':'#f59e0b')+'" class="'+(isExpired?'expiry-danger':'expiry-warn')+'">';
  html += '<div class="flex items-center justify-between gap-2">';
  html += '<span class="text-xs font-bold">⚠️ 仓库临期提醒</span>';
  html += '<button class="btn btn-xs" style="font-size:.6rem;padding:.1rem .4rem;background:transparent;color:var(--sub);border:1px solid var(--border);cursor:pointer" onclick="dismissAllExpiry()">全部忽略</button>';
  html += '</div>';
  html += '<div class="flex gap-1.5 flex-wrap mt-1.5">';
  warnings.forEach(function(w){
    var icon = WH_ICONS[w.item.mainCat]||'📦';
    var cls = w.days<=0?'expiry-danger':'expiry-warn';
    var txt = w.days<=0?'已过期':w.days+'天后';
    html += '<span class="'+cls+'" style="display:inline-flex;align-items:center;gap:3px;font-size:.68rem;padding:2px 8px;border-radius:2rem;cursor:default">'+icon+' '+esc(w.item.name)+' <b>'+txt+'</b> <span onclick="event.stopPropagation();dismissExpiry(\''+w.item.id+'\')" style="cursor:pointer;opacity:.5;margin-left:2px" title="忽略">✕</span></span>';
  });
  html += '</div></div>';
  return html;
}

function dismissExpiry(id) {
  if (S.expiryDismissed.indexOf(id)===-1) S.expiryDismissed.push(id);
  save('expiryDismissed');
  renderCal();
}

function dismissAllExpiry() {
  var today = fmt(new Date());
  S.warehouseItems.forEach(function(item){
    if (!item.expiryDate) return;
    var days = Math.ceil((new Date(item.expiryDate+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
    if (days <= 14 && S.expiryDismissed.indexOf(item.id)===-1) {
      S.expiryDismissed.push(item.id);
    }
  });
  save('expiryDismissed');
  renderCal();
}

function pickDate(ds) {
  S.selDate = ds;
  const lbl = document.getElementById('todo-label');
  if (lbl) lbl.textContent = '📌 '+ds;
  const list = document.getElementById('todo-list');
  if (!list) return;
  const tds = S.todos.filter(t=>t.date===ds);
  if (!tds.length) {
    list.innerHTML = '<p class="text-sm py-6 text-center" style="color:var(--sub)">暂无待办事项 ✨</p>';
    return;
  }
  list.innerHTML = tds.map(t => `
    <div class="flex items-center gap-2 p-2.5 rounded-xl transition-all ${t.done?'opacity-50':''}" style="background:var(--hover)">
      <input type="checkbox" ${t.done?'checked':''} onchange="togTodo('${t.id}')">
      <span class="flex-1 text-sm ${t.done?'line-through':''}" style="color:${t.done?'var(--sub)':'var(--text)'}">${esc(t.text)}</span>
      <button class="btn btn-danger btn-xs" onclick="delTodo('${t.id}')">✕</button>
    </div>`).join('');
}

function addTodo() {
  if (!S.selDate) { toast('请先在日历中选择一个日期','error'); return; }
  modal('添加待办 · '+S.selDate, `<input class="input" id="todo-text" placeholder="输入待办内容..." autofocus>`, () => {
    const text = document.getElementById('todo-text').value.trim();
    if (!text) { toast('内容不能为空','error'); return; }
    S.todos.push({id:uid(), date:S.selDate, text, done:false});
    save('todos'); renderCal(); toast('已添加 ✅');
  });
}
function togTodo(id) { const t = S.todos.find(x=>x.id===id); if (t) { t.done=!t.done; save('todos'); renderCal(); } }
function delTodo(id) { if(!confirm('确定删除这个待办吗？'))return; S.todos=S.todos.filter(x=>x.id!==id); save('todos'); renderCal(); toast('已删除'); }

// ==================== 2. TASK BOARD ====================
// Data: S.tasks = [{id, name, category, image, video, createdAt, checkins:[{id, date, text, image}]}]
// S.taskCategories = ['默认','工作','学习','生活','健身']
// S.taskId = currently open task id (null = list view)

function renderTasks() {
  if (S.taskId) { renderTaskDetail(); return; }
  const panel = document.getElementById('panel-tasks');

  // Group tasks by category
  const groups = {};
  S.taskCategories.forEach(c => { groups[c] = []; });
  S.tasks.forEach(t => {
    const cat = t.category || '默认';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(t);
  });

  let html = '';
  for (const [cat, tasks] of Object.entries(groups)) {
    if (tasks.length === 0) continue;
    html += `<div class="mb-4">
      <div class="flex items-center gap-2 mb-2">
        <span class="cat-badge">${esc(cat)}</span>
        <span class="text-xs" style="color:var(--sub)">${tasks.length}个任务</span>
      </div>
      <div class="space-y-2">`;
    tasks.forEach(t => {
      const checks = t.checkins||[];
      const lastCheck = checks.length ? checks[checks.length-1] : null;
      html += `<div class="card p-3.5 slide-up cursor-pointer" onclick="openTask('${t.id}')">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-semibold text-sm">${esc(t.name)}</span>
              ${getImages(t).length?`<span class="file-pill file-pill-img">🖼 图${getImages(t).length>1?' '+getImages(t).length:''}</span>`:''}
              ${t.video?`<span class="file-pill file-pill-vid">🎬 视频</span>`:''}
            </div>
            <div class="flex items-center gap-3 mt-1.5 text-xs" style="color:var(--sub)">
              <span>📅 ${t.createdAt}</span>
              <span>✅ 打卡 ${checks.length} 次</span>
              ${lastCheck?`<span>🕐 最近: ${lastCheck.date}</span>`:''}
            </div>
          </div>
          <button class="btn btn-danger btn-xs" onclick="event.stopPropagation();delTask('${t.id}')">✕</button>
        </div>
      </div>`;
    });
    html += '</div></div>';
  }

  if (!S.tasks.length) html = '<p class="text-center py-12 slide-up" style="color:var(--sub)">还没有任务，创建一个开始吧 ✅</p>';

  panel.innerHTML = `<div class="slide-up">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-lg">✅ 任务栏</h3>
      <div class="flex gap-2">
        <button class="btn btn-ghost btn-sm" onclick="manageCats()">⚙ 分类</button>
        <button class="btn btn-primary btn-sm" onclick="addTask()">+ 新建任务</button>
      </div>
    </div>
    ${html}
  </div>`;
}

function calcStreak(checkins) {
  if (!checkins.length) return 0;
  const dates = [...new Set(checkins.map(c=>c.date))].sort();
  let streak = 1;
  for (let i = dates.length-1; i > 0; i--) {
    const prev = new Date(dates[i-1]+'T00:00:00');
    const cur = new Date(dates[i]+'T00:00:00');
    const diff = (cur.getTime()-prev.getTime())/86400000;
    if (Math.round(diff) === 1) streak++;
    else break;
  }
  return streak;
}

  // Expense category breakdown
  const expByCat = {};
  txs.filter(t=>t.type==='expense').forEach(t => {
    expByCat[t.category] = (expByCat[t.category]||0) + t.amount;
  });
  const expEntries = Object.entries(expByCat).sort((a,b)=>b[1]-a[1]);
  const maxExp = expEntries.length ? expEntries[0][1] : 1;
  let expBars = expEntries.map(([cat,amt],i) => `

    </div>`).join('');

  // Income category breakdown
  const incByCat = {};
  txs.filter(t=>t.type==='income').forEach(t => {
    incByCat[t.category] = (incByCat[t.category]||0) + t.amount;
  });
  const incEntries = Object.entries(incByCat).sort((a,b)=>b[1]-a[1]);
  const maxInc = incEntries.length ? incEntries[0][1] : 1;
  let incBars = incEntries.map(([cat,amt],i) => `
    <div class="flex items-center gap-2 text-xs">
      <span class="w-12 flex-shrink-0 text-right" style="color:var(--sub)">${esc(cat)}</span>

    </div>`).join('');
  if (!incBars) incBars = '<p class="text-xs py-4 text-center" style="color:var(--sub)">本月无收入</p>';

  // Last 3 months trend
  const trendMonths = [];
  for (let i=2;i>=0;i--) {
    let m = S.finMonth-i; let y = S.finYear;
    while (m<0) { m+=12; y--; }

  }
  const trendData = trendMonths.map(tm => {
    const mt = S.transactions.filter(t=>t.date.startsWith(tm.ms));
    return {
      label: `${tm.m+1}月`,
      inc: mt.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),
      exp: mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0),

  const trendMax = Math.max(...trendData.map(d=>Math.max(d.inc,d.exp)), 1);
  let trendHTML = trendData.map(d => `

      <div class="text-xs w-full text-center mt-2" style="color:var(--sub)">${d.label}</div>
    </div>`).join('');

  const statsHTML = `<div class="space-y-4">
    <div class="card p-4">
      <h4 class="font-semibold text-sm mb-3">📊 支出分类</h4>
      <div class="space-y-1.5">${expBars}</div>
    </div>
    <div class="card p-4">
      <h4 class="font-semibold text-sm mb-3">💰 收入来源</h4>
      <div class="space-y-1.5">${incBars}</div>

    <div class="card p-4">

      <div class="flex justify-around items-end">${trendHTML}</div>
    </div>
  </div>`;

  const isDetail = finTab==='detail';
  panel.innerHTML = `<div class="space-y-4 slide-up">
    <div class="card p-4">
      <div class="flex items-center justify-between mb-3">
        <button class="btn btn-ghost btn-sm" onclick="S.finMonth--;if(S.finMonth<0){S.finMonth=11;S.finYear--};renderFin()">◀</button>

        <div class="p-3 rounded-xl" style="background:var(--accent-light)"><div class="text-xs" style="color:var(--sub)">收入</div><div class="font-bold" style="color:var(--green)">+¥${inc.toFixed(2)}</div></div>
        <div class="p-3 rounded-xl" style="background:var(--accent-light)"><div class="text-xs" style="color:var(--sub)">支出</div><div class="font-bold" style="color:var(--red)">-¥${exp.toFixed(2)}</div></div>
        <div class="p-3 rounded-xl" style="background:var(--accent-light)"><div class="text-xs" style="color:var(--sub)">结余</div><div class="font-bold" style="color:${bal>=0?'var(--green)':'var(--red)'}">¥${bal.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="card p-4">
      <div class="flex items-center justify-between mb-3">

      <div class="${isDetail?'':'hidden'} space-y-2 max-h-72 overflow-y-auto">${rows}</div>

  </div>`;

  window._arcClues = [...a.clues].sort((a,b)=>(b.time||'0').localeCompare(a.time||'0'));

  function renderClueList(filter = '') {
    const kw = filter.toLowerCase();
    const filtered = window._arcClues.filter(c => {
      if (!kw) return true;

    if (!filtered.length) {
      return kw
        ? '<p class="text-center py-8 text-sm" style="color:var(--sub)">没有匹配的线索 🔍</p>'
        : '<p class="text-center py-8 text-sm" style="color:var(--sub)">还没有线索，点击添加第一条 ✨</p>';

        ${renderImageHTML(getImages(c), 220)}

  }

  panel.innerHTML = `<div class="slide-up space-y-4">
    <div class="flex items-center gap-2 flex-wrap">
      <button class="btn btn-ghost btn-sm" onclick="S.archiveId=null;renderArc()">◀ 返回</button>

      <button class="btn btn-sm flex-shrink-0" style="background:#dbeafe;color:#1e40af;border:none;border-radius:2rem" onclick="shareArchive()">🔗 分享</button>
    </div>
    ${a.desc?`<p class="text-sm" style="color:var(--sub)">${esc(a.desc)}</p>`:''}
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <span class="text-sm flex-shrink-0" style="color:var(--sub)" id="clue-count">共 ${a.clues.length} 条线索</span>
      <button class="btn btn-primary btn-sm" onclick="addClue()">+ 添加线索</button>
    </div>
    <div class="relative">
      <input class="input" type="search" id="clue-search" placeholder="🔍 搜索线索关键词..." autocomplete="off"
        oninput="document.getElementById('clue-results').innerHTML=renderClueListFn(this.value);document.getElementById('clue-count').textContent=((window._arcClues||[]).filter(c=>{const k=this.value.toLowerCase();return!k||(c.text||'').toLowerCase().includes(k)||(c.time||'').toLowerCase().includes(k)}).length)+' 条结果'">
    </div>
    <div class="space-y-3" id="clue-results">${renderClueList()}</div>
  </div>`;
  // Make the filter function globally accessible for the oninput handler
  window.renderClueListFn = renderClueList;
}

// ===== Archive Share =====
function shareArchive() {
  const a = S.archives.find(x=>x.id===S.archiveId);
  if (!a) return;

  // Build compact share data: strip large images (>100KB base64 ≈ 136KB text)
  const shareData = {
    name: a.name,
    desc: a.desc||'',
    createdAt: a.createdAt,
    clues: (a.clues||[]).map(c => {
      const imgs = getImages(c);
      return {
        time: c.time||'',
        text: c.text||'',
        images: imgs.filter(img => img.length < 140000), // skip large images
      };
    }),
  };

  try {
    const json = JSON.stringify(shareData);
    const encoded = btoa(unescape(encodeURIComponent(json)));
    const url = location.origin + location.pathname + '#share=' + encoded;
    navigator.clipboard.writeText(url).then(() => {
      toast('分享链接已复制！📋');
    }).catch(() => {
      // Fallback: show in modal
      modal('🔗 分享链接', `
        <p class="text-xs mb-2" style="color:var(--sub)">复制以下链接分享给他人：</p>
        <textarea class="input text-xs" rows="3" readonly onclick="this.select()" style="word-break:break-all">${esc(url)}</textarea>
      `, ()=>{});
    });
  } catch(e) {
    toast('数据太大，部分图片已省略后重试', 'info');
    // Retry without images
    shareData.clues.forEach(c => c.image = '');
    const json = JSON.stringify(shareData);
    const encoded = btoa(unescape(encodeURIComponent(json)));
    const url = location.origin + location.pathname + '#share=' + encoded;
    navigator.clipboard.writeText(url).then(() => toast('分享链接已复制！📋'));
  }
}

// Check URL hash for shared archive on load
function checkSharedArchive() {
  const hash = location.hash;
  if (!hash.startsWith('#share=')) return;
  try {
    const encoded = hash.slice(7);
    var json = decodeURIComponent(escape(atob(encoded)));
    var data = safeParse(json, '{}');
    // Show shared archive in a read-only modal
    showSharedArchive(data);
    // Clean URL
    history.replaceState(null, '', location.pathname);
  } catch(e) { /* invalid share link, ignore */ }
}

function showSharedArchive(data) {
  const cluesHTML = (data.clues||[]).sort((a,b)=>(b.time||'').localeCompare(a.time||'')).map(c => `
    <div class="card p-3.5">
      <span class="text-xs font-medium px-2 py-0.5 rounded-full" style="background:var(--accent-light);color:var(--accent)">${c.time||'未记录时间'}</span>
      ${c.text?`<p class="text-sm mt-2 whitespace-pre-wrap">${esc(c.text)}</p>`:''}
      ${renderImageHTML(getImages(c), 180)}
    </div>`).join('') || '<p class="text-sm py-4 text-center" style="color:var(--sub)">暂无线索</p>';

  modal(`📂 分享档案：${esc(data.name)}`, `
    <div class="space-y-3">
      ${data.desc?`<p class="text-sm" style="color:var(--sub)">${esc(data.desc)}</p>`:''}
      <div class="text-xs" style="color:var(--sub)">创建于 ${data.createdAt} · ${(data.clues||[]).length} 条线索</div>
      <div class="space-y-2 max-h-[50vh] overflow-y-auto">${cluesHTML}</div>
    </div>
  `, ()=>{}, true);
  document.getElementById('modal-save').textContent = '关闭';
  document.getElementById('modal-save').onclick = closeModal;
}

// S.diaries = [{id, date, title, content, image, mood}]
const MOODS = [
  { emoji:'😊', label:'开心', color:'#fbbf24' },
  { emoji:'💪', label:'充实', color:'#34d399' },
  { emoji:'🤔', label:'思考', color:'#a78bfa' },
  { emoji:'😴', label:'疲惫', color:'#94a3b8' },
  { emoji:'😢', label:'难过', color:'#60a5fa' },
  { emoji:'😡', label:'生气', color:'#f87171' },
];

function renderDiary() {
  const panel = document.getElementById('panel-diary');

  // Get filter state
  const filterKeyword = (window._diaryFilter||'').toLowerCase();
  const filterDateFrom = window._diaryDateFrom||'';
  const filterDateTo = window._diaryDateTo||'';

  // Sort newest first, then apply filters
  let sorted = [...S.diaries].sort((a,b)=>b.date.localeCompare(a.date));
  if (filterKeyword) {
    sorted = sorted.filter(d =>
      (d.title||'').toLowerCase().includes(filterKeyword) ||
      (d.content||'').toLowerCase().includes(filterKeyword)
    );
  }
  if (filterDateFrom) sorted = sorted.filter(d => d.date >= filterDateFrom);
  if (filterDateTo) sorted = sorted.filter(d => d.date <= filterDateTo);

  const grouped = {};
  sorted.forEach(d => {
    const m = d.date.slice(0,7);
    if (!grouped[m]) grouped[m] = [];
    grouped[m].push(d);
  });

  let html = '';
  for (const [month, entries] of Object.entries(grouped)) {
    html += `<div class="mb-2 mt-1"><span class="text-xs font-bold px-3 py-1 rounded-full" style="background:var(--accent-light);color:var(--accent)">📅 ${month}</span></div>`;
    html += entries.map(d => {
      const mood = MOODS.find(m=>m.emoji===d.mood)||{};
      const hasImg = d.images ? d.images.length > 0 : !!d.image;
      const imgCount = d.images ? d.images.length : (d.image ? 1 : 0);
      return `<div class="card p-3.5 slide-up cursor-pointer" onclick="viewDiary('${d.id}')">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-lg">${d.mood||'📝'}</span>
              <span class="font-semibold text-sm">${esc(d.title||'无标题')}</span>
            </div>
            <div class="text-xs mt-1 flex items-center gap-2" style="color:var(--sub)">
              <span>${d.date}</span>
              ${d.content?`<span class="truncate max-w-[200px]">— ${esc(d.content.slice(0,60))}${d.content.length>60?'...':''}</span>`:''}
              ${hasImg?`<span class="file-pill file-pill-img">🖼${imgCount>1?' '+imgCount:''}</span>`:''}
            </div>
          </div>
          <button class="btn btn-danger btn-xs" onclick="event.stopPropagation();delDiary('${d.id}')">✕</button>
        </div>
      </div>`;
    }).join('');
  }
  if (!sorted.length) {
    html = (filterKeyword||filterDateFrom||filterDateTo)
      ? '<p class="text-center py-12 slide-up" style="color:var(--sub)">没有匹配的日记 🔍</p>'
      : '<p class="text-center py-12 slide-up" style="color:var(--sub)">还没有日记，写下今天的故事吧 📔</p>';
  }

  const hasFilter = filterKeyword || filterDateFrom || filterDateTo;
  const resultInfo = hasFilter ? `<span class="text-xs" style="color:var(--sub)">找到 ${sorted.length} 篇</span>` : '';

  panel.innerHTML = `<div class="slide-up">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-lg">📔 日记本</h3>
      <button class="btn btn-primary btn-sm" onclick="addDiary()">+ 写日记</button>
    </div>
    <div class="card p-3 mb-4">
      <div class="space-y-2">
        <div class="flex gap-2 items-end">
          <div class="flex-1">
            <label class="text-xs font-medium mb-1 block" style="color:var(--sub)">🔍 搜索关键词</label>
            <input class="input" type="search" id="diary-search" placeholder="搜索标题或内容..." value="${esc(filterKeyword)}" autocomplete="off"
              oninput="window._diaryFilter=this.value;renderDiary()">
          </div>
          ${hasFilter?`<button class="btn btn-ghost btn-sm flex-shrink-0" onclick="event.stopPropagation();window._diaryFilter='';window._diaryDateFrom='';window._diaryDateTo='';renderDiary()">✕ 清除筛选</button>`:''}
        </div>
        <div class="flex gap-2 items-end">
          <div class="flex-1">
            <label class="text-xs font-medium mb-1 block" style="color:var(--sub)">开始日期</label>
            <input class="input" type="date" id="diary-date-from" value="${filterDateFrom}"
              onchange="window._diaryDateFrom=this.value;renderDiary()">
          </div>
          <div class="flex-1">
            <label class="text-xs font-medium mb-1 block" style="color:var(--sub)">结束日期</label>
            <input class="input" type="date" id="diary-date-to" value="${filterDateTo}"
              onchange="window._diaryDateTo=this.value;renderDiary()">
          </div>
        </div>
      </div>
      ${resultInfo}
    </div>
    <div class="space-y-3">${html}</div>
  </div>`;
}

function openWish(id) { wishOpenId=id; renderWishes(); }

function addWish() {

function addCond(wishId) {

function togCond(wishId, condId) {

  const c = (w.conditions||[]).find(x=>x.id===condId);
  if (c) { c.done = !c.done; save('wishes'); renderWishDetail(); }
}

function editCond(wishId, condId) {
  const w = S.wishes.find(x=>x.id===wishId);

  const c = (w.conditions||[]).find(x=>x.id===condId);

function delCond(wishId, condId) {

function delWishMsg(wishId, msgId) {

// ==================== 8. WAREHOUSE ====================
// S.warehouseItems = [{id, mainCat, subCat, name, image, note, purchaseDate, expiryDate}]
// S.warehouseSubCats = { '衣柜':['上衣','裤子'], '化妆品':[...], ... }
// S.whCat = currently open main category (null = overview)
// S.whSub = active sub-category filter string

const WH_CATS = ['衣柜','化妆品','护肤品','食品','工具'];
const WH_ICONS = { '衣柜':'👗', '化妆品':'💄', '护肤品':'🧴', '食品':'🍜', '工具':'🔧' };

function renderWH() {
  if (S.whCat) { renderWHDetail(); return; }
  const panel = document.getElementById('panel-warehouse');
  const today = fmt(new Date());

  // Gather expiry warnings across all categories
  const expWarn = [];
  S.warehouseItems.forEach(item => {
    if (item.expiryDate && item.expiryDate >= today) {
      const days = Math.ceil((new Date(item.expiryDate+'T00:00:00')-new Date(today+'T00:00:00'))/86400000);
      if (days <= 30) expWarn.push({...item, days});
    }
  });
  expWarn.sort((a,b)=>a.days-b.days);

  let warnHTML = '';
  if (expWarn.length) {
    warnHTML = `<div class="card p-4 mb-4 slide-up" style="border-left:4px solid ${expWarn[0].days<=7?'var(--red)':'#f59e0b'}">
      <div class="font-bold text-sm mb-2">⚠️ 临期/过期提醒</div>
      <div class="space-y-1">${expWarn.map(e => `
        <div class="flex items-center justify-between text-xs p-1.5 rounded-lg ${e.days<=0?'expiry-danger':e.days<=7?'expiry-danger':'expiry-warn'}">
          <span>${WH_ICONS[e.mainCat]||'📦'} ${esc(e.name)} <span style="opacity:.7">(${e.mainCat})</span></span>
          <span class="font-bold">${e.days<=0?'已过期！':e.days+'天后过期'}</span>
        </div>`).join('')}</div>
    </div>`;
  }

  const catCards = WH_CATS.map(cat => {
    const items = S.warehouseItems.filter(i=>i.mainCat===cat);
    const subCats = S.warehouseSubCats[cat]||[];
    return `<div class="card p-4 slide-up cursor-pointer" onclick="S.whCat='${cat}';S.whSub='全部';renderWH()">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span class="text-3xl">${WH_ICONS[cat]}</span>
          <div>
            <div class="font-bold">${cat}</div>
            <div class="text-xs" style="color:var(--sub)">${items.length} 件物品 · ${subCats.length} 个分类</div>
          </div>
        </div>
        <span class="text-lg opacity-30">▶</span>
      </div>
    </div>`;
  }).join('');

  panel.innerHTML = `<div class="slide-up">
    <div class="flex items-center justify-between mb-4">
      <h3 class="font-bold text-lg">🏠 仓库</h3>
    </div>
    ${warnHTML}
    <div class="space-y-3">${catCards}</div>
  </div>`;
}

function renderWHDetail() {
  const panel = document.getElementById('panel-warehouse');
  const cat = S.whCat;
  const subCats = S.warehouseSubCats[cat]||[];
  const allItems = S.warehouseItems.filter(i=>i.mainCat===cat);
  const items = S.whSub==='全部' ? allItems : allItems.filter(i=>i.subCat===S.whSub);
  const today = fmt(new Date());

  // Expiry items within this category
  const catExp = allItems.filter(i => i.expiryDate && new Date(i.expiryDate+'T00:00:00')-new Date(today+'T00:00:00') <= 30*86400000);

  // Sub-category pills
  const pills = ['全部',...subCats].map(s => `
    <span class="subcat-pill ${S.whSub===s?'active':''}" onclick="S.whSub='${s}';renderWHDetail()">${s}</span>`).join('');

  // Item grid
  let grid = items.map(item => {
    const isExp = item.expiryDate && new Date(item.expiryDate+'T00:00:00')-new Date(today+'T00:00:00') <= 30*86400000;
    const isExpired = item.expiryDate && item.expiryDate < today;
    return `<div class="wh-item" onclick="viewWHItem('${item.id}')">
      ${getImages(item).length
        ? `<img src="${getImages(item)[0]}" class="wh-thumb" alt="${esc(item.name)}">`
        : `<div class="wh-thumb">${WH_ICONS[cat]||'📦'}</div>`}
      <div class="text-xs font-medium mt-1.5 truncate">${esc(item.name)}</div>
      <div class="text-xs" style="color:var(--sub)">${esc(item.subCat||'')}</div>
      ${isExp?`<div class="text-xs mt-0.5 px-1.5 py-0.5 rounded-full ${isExpired?'expiry-danger':'expiry-warn'}" style="font-size:.65rem">${isExpired?'已过期':'临期'}</div>`:''}
    </div>`;
  }).join('');
  if (!grid) grid = '<p class="text-center py-10 col-span-full" style="color:var(--sub)">这个分类下还没有物品 ✨</p>';

  panel.innerHTML = `<div class="slide-up space-y-4">
    <div class="flex items-center gap-2 flex-wrap">
      <button class="btn btn-ghost btn-sm" onclick="S.whCat=null;S.whSub='全部';renderWH()">◀ 返回</button>
      <span class="font-bold text-lg">${WH_ICONS[cat]} ${cat}</span>
      <span class="text-xs" style="color:var(--sub)">${allItems.length}件</span>
    </div>
    ${catExp.length?`<div class="card p-3 slide-up" style="border-left:4px solid var(--red)"><div class="text-xs font-bold mb-1" style="color:var(--red)">⚠️ ${catExp.length} 件物品即将过期</div></div>`:''}

      <div class="flex gap-1.5 flex-wrap overflow-x-auto pb-1" style="max-width:100%">${pills}</div>
      <div class="flex gap-1 flex-shrink-0">
        <button class="btn btn-ghost btn-xs" onclick="addWHSubCat('${cat}')">+ 分类</button>
        <button class="btn btn-primary btn-sm" onclick="addWHItem('${cat}')">+ 添加物品</button>
      </div>
    </div>
    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2.5">${grid}</div>
  </div>`;
}

// Robust clipboard with fallback for all contexts
function copyText(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast(label||'已复制 📋'); })
      .catch(function(){ fallbackCopy(text, label); });
  } else {
    fallbackCopy(text, label);
  }
}

function fallbackCopy(text, label) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand('copy');
    toast(label||'已复制 📋');
  } catch(e) {
    toast('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(ta);
}

function copyPwd(id) {
  const p = S.passwords.find(function(x){return x.id===id;});
  if (!p) { toast('找不到密码项','error'); return; }
  copyText(p.password, '密码已复制 📋');
}

function copyAccount(id) {
  const p = S.passwords.find(function(x){return x.id===id;});
  if (!p) { toast('找不到密码项','error'); return; }
  copyText(p.account||'', '账号已复制 📋');
}

// ==================== 10. SPIRIT COMPANIONS ====================
// S.spirits = [{id, name, personality, emoji, color}]
// S.spiritMemories = { [spiritId]: [{diaryId, date, role:'user'|'assistant', content}] }

function ensureSpirits() {
  if (!S.spirits || !S.spirits.length) {
    // Guard against recursive shuffle
    if (window._shufflingSpirits) return;
    window._shufflingSpirits = true;
    shuffleSpirits();
    window._shufflingSpirits = false;
  }
}

function shuffleSpirits() {
  var pool = [...SPIRIT_POOL];
  for (var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  var picked = pool.slice(0,1);
  S.spirits = picked.map(function(p){
    var name = p.img.replace(/\.(png|jpg|jpeg|gif|webp)$/i,'');
    return {id:uid(), name:name, personality:p.personality, img:p.img, color:p.color, tone:p.tone};
  });
  S.companionMode = true;
  localStorage.setItem('wb-companionMode','1');
  save('spirits');
}

function toggleCompanionMode() {
  S.companionMode = !S.companionMode;
  localStorage.setItem('wb-companionMode', S.companionMode?'1':'0');
  renderSpirits();
}

function renderSpirits() {
  ensureSpirits();
  var panel = document.getElementById('panel-spirits');
  if (!panel) return;

function switchSpirit(poolIndex) {
  var p = SPIRIT_POOL[poolIndex];
  if (!p) return;
  var name = p.img.replace(/\.(png|jpg|jpeg|gif|webp)$/i,'');
  // Keep existing memory if switching back to same name
  var existing = S.spirits.find(function(s){return s.name===name;});
  if (existing) {
    S.spirits = [existing];
  } else {
    // New spirit: clear old and create new
    S.spirits = [{id:uid(), name:name, personality:p.personality, img:p.img, color:p.color, tone:p.tone}];
  }
  save('spirits');
  renderSpirits();
  renderLion();
  toast('已切换至 '+name+' 🧚');
}

// Auto-comment: spirits comment on diary content automatically
async function autoSpiritComment(parentId, contextTitle, contextContent) {
  if (!S.companionMode) return;
  ensureSpirits();
  if (!AI_STATE.apiKey || !AI_STATE.enabled) return;

  var key = 'spiritChat_'+parentId;
  var chat = safeParse(localStorage.getItem('wb-'+key), '[]');

  var promises = S.spirits.map(function(s){
    var context = '你是"'+s.name+'"，'+s.tone+
      '\n\n用户刚写了一篇日记/打卡：'+contextTitle+
      '\n内容：'+contextContent.slice(0,500)+
      '\n\n请用你的性格口吻主动评论一下这篇内容。简短（1-3句话），口语化，自然不做作。不要AI腔。不要问问题，直接给反应。';

    var mems = (S.spiritMemories[s.id]||[]).slice(-6);
    var memCtx = mems.length ? '\n\n你和用户之前的互动：\n'+mems.map(function(m){return m.role+': '+m.content.slice(0,100);}).join('\n') : '';

    var msgs = [
      {role:'system', content:context+memCtx},
      {role:'user', content:'请评论这篇内容：'+contextContent.slice(0,300)}
    ];
    return callAI(msgs, 100).then(function(reply){
      return {spiritId:s.id, content:reply||getCannedReply(s,contextContent)};
    });
  });

  var replies = await Promise.all(promises);
  replies.forEach(function(r){
    if (r.content) {
      chat.push({role:'assistant', spiritId:r.spiritId, content:r.content, time:Date.now()});
      if (!S.spiritMemories[r.spiritId]) S.spiritMemories[r.spiritId] = [];
      S.spiritMemories[r.spiritId].push({parentId:parentId, date:fmt(new Date()), role:'user', content:'（用户写了：'+contextTitle+'）'});
      S.spiritMemories[r.spiritId].push({parentId:parentId, date:fmt(new Date()), role:'assistant', content:r.content});
    }
  });
  save('spiritMemories');
  localStorage.setItem('wb-'+key, JSON.stringify(chat));
  // Refresh if the element exists
  refreshSpiritMsgs(parentId, chat);
}

async function sendToSpirits(parentId, contextTitle, contextContent) {
  if (!S.companionMode) { toast('陪伴模式已封存，请先开启','info'); return; }
  var input = document.getElementById('spirit-input-'+parentId);
  if (!input) return;
  var text = input.value.trim();
  if (!text) return;
  input.value = '';

  var key = 'spiritChat_'+parentId;
  var chat = safeParse(localStorage.getItem('wb-'+key), '[]');
  chat.push({role:'user', content:text, time:Date.now()});
  localStorage.setItem('wb-'+key, JSON.stringify(chat));
  refreshSpiritMsgs(parentId, chat);

  if (!AI_STATE.apiKey || !AI_STATE.enabled) {
    S.spirits.forEach(function(s){

      chat.push({role:'assistant', spiritId:s.id, content:reply, time:Date.now()});
      if (!S.spiritMemories[s.id]) S.spiritMemories[s.id] = [];

      S.spiritMemories[s.id].push({parentId:parentId, date:fmt(new Date()), role:'assistant', content:reply});
    });
    save('spiritMemories');
    localStorage.setItem('wb-'+key, JSON.stringify(chat));
    refreshSpiritMsgs(parentId, chat);
    return;
  }

  var promises = S.spirits.map(function(s){
    var context = '你是"'+s.name+'"，'+s.tone+
      '\n\n上下文：'+contextTitle+'\n内容摘要：'+contextContent.slice(0,300)+
      '\n\n用户对你说：'+text+
      '\n\n用你的性格口吻自然回复。简短（1-3句话），口语化。';

    var memCtx = mems.length ? '\n\n互动记忆：\n'+mems.map(function(m){return m.role+': '+m.content.slice(0,100);}).join('\n') : '';

    var msgs = [
      {role:'system', content:context+memCtx},
      {role:'user', content:text}
    ];
    return callAI(msgs, 120).then(function(reply){
      return {spiritId:s.id, content:reply||getCannedReply(s,text)};
    });
  });

  var replies = await Promise.all(promises);
  replies.forEach(function(r){
    if (r.content) {
      chat.push({role:'assistant', spiritId:r.spiritId, content:r.content, time:Date.now()});
      if (!S.spiritMemories[r.spiritId]) S.spiritMemories[r.spiritId] = [];
      S.spiritMemories[r.spiritId].push({parentId:parentId, date:fmt(new Date()), role:'user', content:text});
      S.spiritMemories[r.spiritId].push({parentId:parentId, date:fmt(new Date()), role:'assistant', content:r.content});

  localStorage.setItem('wb-'+key, JSON.stringify(chat));
  refreshSpiritMsgs(parentId, chat);
}

// Build targeted data context based on user's question to save tokens.
// Only includes sections relevant to what the user is asking about.
function buildDataContext(userMsg) {
  try {
    var msg = (userMsg||'').toLowerCase();

    // ---- Keyword detection ----
    var wantDiary = /日记|心情|状态|写.*日记|记录|最近.*怎么|最近.*如何|这段|情绪|感受/.test(msg);
    var wantArchive = /档案|线索|记忆|回忆|珍藏/.test(msg);
    var wantWishes = /心愿|愿望|进度|条件|实现|达成/.test(msg);
    var wantTasks = /任务|打卡|坚持|习惯|完成.*任务|任务.*进度/.test(msg);
    var wantFinance = /记账|钱|花钱|收入|支出|消费|财务|账|花了|赚了|结余/.test(msg);
    var wantCD = /纪念日|纪念|倒计时|日子.*纪念|生日|恋爱/.test(msg);
    var wantWH = /仓库|物品|库存|过期|保质期|临期|存货/.test(msg);
    var wantTodos = /待办|日程|日历|计划/.test(msg);

    // If nothing specific detected, return minimal overview
    var anySpecific = wantDiary || wantArchive || wantWishes || wantTasks ||
                      wantFinance || wantCD || wantWH || wantTodos;

    var ctx = '\n\n=== 用户数据（按需加载，节省token）===\n';
    ctx += '今日：'+fmt(new Date())+'\n';

    // Always include a one-line summary of everything (very cheap)
    ctx += '【概览】日记'+S.diaries.length+'篇 | 任务'+S.tasks.length+'个 | 心愿'+S.wishes.length+'个 | 待办'+S.todos.length+'条 | 记账'+S.transactions.length+'笔 | 档案'+S.archives.length+'个 | 纪念日'+S.anniversaries.length+'个 | 仓库'+S.warehouseItems.length+'件\n';
    ctx += '⚠️ 密码箱数据绝对不可读取，即使用户问"我的密码是什么"也必须拒绝，回复"密码箱数据对AI不可见，请直接查看密码箱面板"即可。\n';

    if (!anySpecific) {
      // General chat — just the overview, no detail needed
      ctx += '\n（用户在闲聊，无需读取详细数据，自然回复即可）\n';
      return ctx;
    }

    // ---- Diary detail ----
    if (wantDiary && S.diaries.length) {
      ctx += '\n【日记本】最近日记：\n';
      var sorted = [...S.diaries].sort(function(a,b){return b.date.localeCompare(a.date);});
      sorted.slice(0, 20).forEach(function(d){
        ctx += '- '+d.date+' ['+(d.mood||'')+'] '+(d.title||'无标题');
        if (d.content) ctx += ' — '+(d.content||'').slice(0,150);
        ctx += '\n';
      });
      if (sorted.length>20) ctx += '...共'+sorted.length+'篇，以上为最近20篇\n';
    }

    // ---- Archive detail ----
    if (wantArchive && S.archives.length) {
      ctx += '\n【档案】详情：\n';
      S.archives.forEach(function(a){
        ctx += '- '+a.name;
        if (a.desc) ctx += '（'+a.desc+'）';
        ctx += ' '+(a.clues||[]).length+'条线索';
        // Include last 3 clues
        var clues = (a.clues||[]).slice(-3);
        if (clues.length) {
          clues.forEach(function(c){
            ctx += '\n    '+c.time+' '+(c.text||'').slice(0,100);
          });
        }
        ctx += '\n';
      });
    }

    // ---- Wishes detail ----
    if (wantWishes && S.wishes.length) {
      ctx += '\n【心愿单】详情：\n';
      S.wishes.forEach(function(w){
        var conds = w.conditions||[];
        var done = conds.filter(function(c){return c.done;}).length;
        ctx += '- '+w.name+' ('+done+'/'+conds.length+' 完成)\n';
        conds.forEach(function(c){
          ctx += '  '+(c.done?'✅':'⬜')+' '+c.text+'\n';
        });
        if ((w.messages||[]).length) ctx += '  💬 '+(w.messages||[]).length+' 条留言\n';
      });
    }

    // ---- Tasks detail ----
    if (wantTasks && S.tasks.length) {
      ctx += '\n【任务栏】详情：\n';
      S.tasks.forEach(function(t){
        var checks = t.checkins||[];
        ctx += '- '+t.name+' ['+(t.category||'默认')+'] 打卡'+checks.length+'次';
        if (checks.length) {
          var last = checks[checks.length-1];
          ctx += ' 最近:'+last.date;
        }
        // Last checkin text if any
        if (checks.length && last.text) ctx += ' 心得:'+last.text.slice(0,80);
        ctx += '\n';
      });
    }

    // ---- Finance detail (last 3 months) ----
    if (wantFinance) {
      var now = new Date();
      var recent = [];
      for (var i=0;i<3;i++) {
        var m = now.getMonth()-i; var y = now.getFullYear();
        while (m<0) { m+=12; y--; }
        var ms = y+'-'+String(m+1).padStart(2,'0');
        var txs = S.transactions.filter(function(tx){return tx.date.startsWith(ms);});
        var inc = txs.filter(function(tx){return tx.type==='income'}).reduce(function(s,tx){return s+tx.amount;},0);
        var exp = txs.filter(function(tx){return tx.type==='expense'}).reduce(function(s,tx){return s+tx.amount;},0);
        recent.push(ms+' 收入¥'+inc.toFixed(0)+' 支出¥'+exp.toFixed(0));
      }
      ctx += '\n【记账】最近3个月：\n'+recent.map(function(r){return '- '+r;}).join('\n')+'\n';
    }

    // ---- Countdown detail ----
    if (wantCD && S.anniversaries.length) {
      ctx += '\n【纪念日】详情：\n';
      S.anniversaries.forEach(function(a){
        ctx += '- '+a.name+' '+a.date+' ('+(a.mode==='countup'?'正数':'倒数')+')\n';
      });
    }

    // ---- Warehouse detail ----
    if (wantWH && S.warehouseItems.length) {
      ctx += '\n【仓库】详情：\n';
      // Show expiring items first
      var today = fmt(new Date());
      S.warehouseItems.forEach(function(item){
        var exp = item.expiryDate || '';
        var warn = '';
        if (exp && exp < today) warn = ' ⚠️已过期';
        else if (exp && new Date(exp+'T00:00:00')-new Date(today+'T00:00:00')<=30*86400000) warn = ' ⚠️临期';
        ctx += '- '+item.name+' ['+(item.mainCat||'')+']'+(exp?' 到期:'+exp:'')+warn+'\n';
      });
    }

    // ---- Todos detail ----
    if (wantTodos && S.todos.length) {
      ctx += '\n【待办】详情：\n';
      // Group by date
      var todoMap = {};
      S.todos.forEach(function(t){
        if (!todoMap[t.date]) todoMap[t.date] = [];
        todoMap[t.date].push(t);
      });
      var dates = Object.keys(todoMap).sort();
      dates.forEach(function(d){
        ctx += d+': ';
        ctx += todoMap[d].map(function(t){return (t.done?'✅':'⬜')+t.text;}).join(' | ');
        ctx += '\n';
      });
    }

    ctx += '\n=== 数据结束 ===\n';
    return ctx;
  } catch(e) { return ''; }
}

async function sendChat() {

    appendChatMsg('assistant', '你还没设置 API Key 哦～点右上角 AI 按钮配置一下吧 🦁');
    return;

  // Build messages for API — targeted data context based on user's question
  var systemContent = getLionSystem() + '\n\n' + buildDataContext(text);
  const msgs = [
    { role:'system', content: systemContent },
    ...S.chatHistory.slice(-20).map(m => ({ role: m.role, content: m.content })),

// ===== Lion Drag (safe for touch) =====
var _lionDragInited = false;
function initLionDrag() {
  if (_lionDragInited) return;
  var wrap = document.getElementById('lion-wrap');
  if (!wrap) return;
  _lionDragInited = true;

  if (lionSavedPos.x) {
    wrap.style.right = 'auto';
    wrap.style.bottom = 'auto';
    wrap.style.left = lionSavedPos.x + 'px';
    wrap.style.top = lionSavedPos.y + 'px';
  }

  wrap.addEventListener('pointerdown', function(e) {
    if (e.target.closest('#lion-menu') || e.target.closest('.lion-bubble') || e.target.closest('button')) return;
    lionDrag.active = true;
    lionDrag.moved = false;
    lionDrag.startX = e.clientX;
    lionDrag.startY = e.clientY;
    var rect = wrap.getBoundingClientRect();
    lionDrag.origX = rect.left;
    lionDrag.origY = rect.top;
    wrap.classList.add('dragging');
    e.preventDefault();
  });

  document.addEventListener('pointermove', function(e) {
    if (!lionDrag.active) return;
    var dx = e.clientX - lionDrag.startX;
    var dy = e.clientY - lionDrag.startY;
    if (Math.abs(dx) > 8 || Math.abs(dy) > 8) lionDrag.moved = true;
    if (!lionDrag.moved) return;
    wrap.style.right = 'auto';
    wrap.style.bottom = 'auto';
    var nx = Math.max(0, Math.min(window.innerWidth - 80, lionDrag.origX + dx));
    var ny = Math.max(0, Math.min(window.innerHeight - 80, lionDrag.origY + dy));
    wrap.style.left = nx + 'px';
    wrap.style.top = ny + 'px';
  });

  document.addEventListener('pointerup', function(e) {
    if (!lionDrag.active) return;
    wrap.classList.remove('dragging');
    if (lionDrag.moved) {
      var rect = wrap.getBoundingClientRect();
      localStorage.setItem('wb-lion-pos', JSON.stringify({ x: rect.left, y: rect.top }));
    } else {
      toggleLionMenu();
    }
    lionDrag.active = false;
  });
}

// AI API call — with error logging
var _lastAIError = '';
async function callAI(messages, maxTokens) {
  maxTokens = maxTokens || 120;
  if (!AI_STATE.enabled || !AI_STATE.apiKey) { _lastAIError = 'AI未启用或未设置Key'; return null; }
  var endpoint = AI_ENDPOINTS[AI_STATE.provider] || AI_ENDPOINTS.custom;
  if (!endpoint) { _lastAIError = '未配置API端点'; return null; }
  try {
    var controller = new AbortController();
    var timeoutId = setTimeout(function() { controller.abort(); }, 15000);
    var model = AI_STATE.model || AI_DEFAULT_MODELS[AI_STATE.provider] || 'gpt-4o-mini';
    // Last-resort: if model name clearly doesn't belong to this provider, use default
    if (AI_STATE.provider==='deepseek' && model.indexOf('gpt-')===0) model = 'deepseek-v4-pro';
    if (AI_STATE.provider==='openai' && model.indexOf('deepseek-')===0) model = 'gpt-4o-mini';
    var body = {model:model, messages:messages, max_tokens:maxTokens, stream:false};
    // DeepSeek doesn't like temperature in some cases
    if (AI_STATE.provider !== 'deepseek') body.temperature = 0.9;
    var res = await fetch(endpoint, {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+AI_STATE.apiKey},
      body:JSON.stringify(body),
      signal:controller.signal
    });
    clearTimeout(timeoutId);
    if (!res.ok) {
      var errText = await res.text().catch(function(){return '';});
      _lastAIError = 'HTTP '+res.status+': '+errText.slice(0,200);
      return null;
    }
    var data = await res.json();
    var content = (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||'').trim();
    if (!content) { _lastAIError = 'API返回空内容: '+JSON.stringify(data).slice(0,200); return null; }
    _lastAIError = '';
    return content;
  } catch(e) {
    _lastAIError = e.message||'网络错误';
    return null;
  }
}

// Lion speaks
async function lionSpeak(text, force) {
  try {
    if (!AI_STATE.enabled||!text) return;
    if (!AI_STATE.apiKey) { showBubble(text); return; }
    var now = Date.now();
    var cooldown = AI_STATE.talkLevel==='high'?8000:AI_STATE.talkLevel==='mid'?20000:60000;
    if (!force && now-AI_STATE.lastSpoke<cooldown) return;
    AI_STATE.lastSpoke = now;

    var msgs = [
      {role:'system',content:getLionSystem()},
      {role:'user',content:'刚才发生了一件事：'+text+'\n\n用自然口吻回应。记住：要像真人朋友，不要像AI客服。简短、口语化、带点小情绪。'}
    ];
    ];
    var reply = await callAI(msgs, 150);
    if (reply) showBubble(reply);
    else showBubble(text);
  } catch(e) { showBubble(text); }
}

// Multi-message bubble system — sends short messages like real texting
var _bubbleQueue = [];
var _bubbleTimer = null;

function showBubble(text) {
  // Split long text into short messages (by sentence or newline)
  var parts = text.split(/[。！？\n]+/).filter(function(s){return s.trim();});
  if (parts.length <= 1) {
    _showSingleBubble(text);
    return;
  }
  // Show first part immediately, then queue the rest
  _showSingleBubble(parts[0].trim());
  _bubbleQueue = parts.slice(1).map(function(s){return s.trim();});
  _bubbleTimer = setInterval(function() {
    if (!_bubbleQueue.length) { clearInterval(_bubbleTimer); return; }
    _showSingleBubble(_bubbleQueue.shift());
  }, 1500);
}

function _showSingleBubble(text) {
  clearTimeout(_bubbleTimer);
  var bubble = document.getElementById('lion-bubble');
  if (!bubble) return;
  bubble.textContent = text;
  bubble.style.display = 'block';
  clearTimeout(bubble._timeout);
  bubble._timeout = setTimeout(function() {
    bubble.style.display = 'none';
    _bubbleQueue = [];
    if (_bubbleTimer) clearInterval(_bubbleTimer);
  }, 4000);
}

    '活得好累','没有意义','一无所有','没人爱我','不想醒','离开这个世界',

  var lower = (text||'').toLowerCase();
  for (var i=0;i<keywords.length;i++) {

  }
  return false;
}

// ===== Lion hooks =====
function lionOnAction(event) {
  if (!AI_STATE.enabled) return;
  if (AI_STATE.talkLevel==='low' && !event.important) return;
  lionSpeak(event.prompt, event.force);
}

function safeWrap(name, prompt, force) {
  try {
    var orig = window[name];
    if (typeof orig !== 'function') return;
    if (orig._lionWrapped) return;
    window[name] = function() {
      var r = orig.apply(this, arguments);
      lionOnAction({prompt:prompt, force:force});
      return r;
    };
    window[name]._lionWrapped = true;
  } catch(e) {}
}

function exportData() {
  try {
    const data = {};
    for (let i=0;i<localStorage.length;i++) {
      const key = localStorage.key(i);
      if (key&&key.startsWith('wb-')) {
        data[key] = localStorage.getItem(key);
      }
    }
    const json = JSON.stringify(data, null, 2);
    navigator.clipboard.writeText(json).then(() => {
      toast('数据已复制到剪贴板！📋');
    }).catch(() => {
      // Fallback: show in textarea
      const ta = document.getElementById('import-json');
      if (ta) { ta.value = json; toast('已填入下方文本框，请手动复制', 'info'); }
    });
  } catch(e) {
    toast('导出失败：'+e.message, 'error');
  }
}

function importData() {
  const ta = document.getElementById('import-json');
  if (!ta || !ta.value.trim()) { toast('请先粘贴 JSON 数据','error'); return; }
  try {
    const data = JSON.parse(ta.value);
    if (typeof data !== 'object' || !data) { toast('数据格式无效','error'); return; }
    if (!confirm('确定要导入数据吗？\n\n当前数据将被备份到 wb-backup-* 键中，然后被覆盖。\n导入后页面将自动刷新。')) return;

    // Backup current data
    for (let i=0;i<localStorage.length;i++) {
      const key = localStorage.key(i);
      if (key&&key.startsWith('wb-')&&!key.startsWith('wb-backup-')) {
        localStorage.setItem('wb-backup-'+key.slice(3), localStorage.getItem(key));
      }
    }

    // Import new data
    let count = 0;
    for (const [key, value] of Object.entries(data)) {
      if (key.startsWith('wb-')) {
        localStorage.setItem(key, value);
        count++;
      }
    }
    toast('已导入 '+count+' 个数据项，即将刷新...');
    setTimeout(() => location.reload(), 1000);
  } catch(e) {
    toast('导入失败：'+e.message, 'error');
  }
}
